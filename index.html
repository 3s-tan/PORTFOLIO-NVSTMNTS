<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<style>
  :root{
    --bg:#0b0d14; --card:rgba(255,255,255,.04); --border:rgba(255,255,255,.08);
    --text:#eef0f6; --muted:#8a90a6; --accent:#7c5cff; --accent2:#22d3ee;
    --green:#34d399; --red:#f87171; --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(124,92,255,.18), transparent 40%),
      radial-gradient(circle at 90% 20%, rgba(34,211,238,.12), transparent 40%);
  }
  .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 60px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px}
  .brand{font-size:14px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
  .greet{font-size:22px;font-weight:600;margin-top:4px}
  .btn{border:none;cursor:pointer;font:inherit;font-weight:600;font-size:14px;padding:11px 18px;border-radius:12px;
       background:linear-gradient(135deg,var(--accent),#9f7aea);color:#fff;transition:.2s;box-shadow:0 6px 20px rgba(124,92,255,.35)}
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{background:var(--card);border:1px solid var(--border);box-shadow:none;color:var(--text)}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;backdrop-filter:blur(12px)}
  .hero{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin-bottom:20px}
  .label{color:var(--muted);font-size:13px}
  .total{font-size:44px;font-weight:700;letter-spacing:-.02em;margin:6px 0 4px}
  .chg{font-size:14px;font-weight:600}
  .up{color:var(--green)} .down{color:var(--red)}
  .stats{display:flex;gap:28px;margin-top:16px;flex-wrap:wrap}
  .stats b{display:block;font-size:17px;margin-top:2px}
  canvas{width:100%;display:block;max-height:220px}
  .legend{display:flex;flex-direction:column;gap:8px;margin-top:14px;font-size:13px}
  .legend div{display:flex;align-items:center;gap:8px}
  .legend span.dot{width:10px;height:10px;border-radius:50%}
  .legend .pct{margin-left:auto;color:var(--muted)}
  h3{font-size:16px;font-weight:600}
  .row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-bottom:20px}
  .asset{padding:18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
  .asset:hover{transform:translateY(-3px);border-color:rgba(124,92,255,.5)}
  .asset::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
  .asset .type{font-size:11px;padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.07);color:var(--muted)}
  .asset .name{font-weight:600;font-size:16px;margin:10px 0 4px}
  .asset .val{font-size:22px;font-weight:700}
  .asset .gain{font-size:12px;margin-top:4px}
  .tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
  .tx:last-child{border:none}
  .tx .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;flex-shrink:0}
  .tx .meta{flex:1;min-width:0}
  .tx .meta small{color:var(--muted);display:block;font-size:12px}
  .tx .amt{font-weight:600;white-space:nowrap}
  .tx .x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px}
  .tx .x:hover{color:var(--text);background:rgba(255,255,255,.08)}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:14px}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
  .modal.show{display:flex;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:#151826;border:1px solid var(--border);border-radius:22px;padding:26px;width:100%;max-width:400px}
  .sheet h3{margin-bottom:18px;font-size:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font:inherit;font-size:15px;outline:none}
  input:focus,select:focus{border-color:var(--accent)}
  select option{background:#151826}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(255,255,255,.04);padding:5px;border-radius:12px}
  .seg button{border:none;background:none;color:var(--muted);padding:9px;border-radius:9px;cursor:pointer;font:inherit;font-size:13px;font-weight:600}
  .seg button.on{background:var(--accent);color:#fff}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .actions{display:flex;gap:10px;margin-top:20px}
  .actions .btn{flex:1}
  .del{color:var(--red);background:none;border:none;cursor:pointer;font:inherit;font-size:13px;margin-top:14px}
  footer{display:flex;gap:10px;justify-content:center;margin-top:30px}
  @media(max-width:760px){.hero{grid-template-columns:1fr}.total{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand">My Portfolio</div>
      <div class="greet" id="greet">Hello 👋</div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn ghost" onclick="openAsset()">+ Asset</button>
      <button class="btn" onclick="openTx()">+ Transaction</button>
    </div>
  </header>

  <div class="hero">
    <div class="card">
      <div class="label">Total Net Worth</div>
      <div class="total" id="total">₱0.00</div>
      <canvas id="line" height="200"></canvas>
      <div class="stats">
        <div><span class="label">Invested</span><b id="sInv">₱0</b></div>
        <div><span class="label">Assets</span><b id="sCount">0</b></div>
        <div><span class="label">Transactions</span><b id="sTx">0</b></div>
      </div>
    </div>
    <div class="card">
      <h3>Allocation</h3>
      <canvas id="donut" height="200" style="max-width:220px;margin:16px auto 0"></canvas>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="row-head"><h3>Assets</h3></div>
  <div class="assets" id="assets"></div>

  <div class="card">
    <div class="row-head"><h3>Recent Activity</h3></div>
    <div id="txList"></div>
  </div>

  <footer>
    <button class="btn ghost sm" onclick="exportData()">⬇ Backup</button>
    <button class="btn ghost sm" onclick="document.getElementById('imp').click()">⬆ Restore</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">
  </footer>
</div>

<!-- Asset modal -->
<div class="modal" id="mAsset" onclick="if(event.target===this)close_('mAsset')">
  <div class="sheet">
    <h3 id="aTitle">New Asset</h3>
    <div class="field"><label>Name</label><input id="aName" placeholder="e.g. VOO, MariBank, MP2"></div>
    <div class="field"><label>Type</label>
      <select id="aType">
        <option>HYSA</option><option>Stocks / ETF</option><option>REITs</option>
        <option>MP2</option><option>UITF / Mutual Fund</option><option>Crypto</option>
        <option>Cash</option><option>Business</option><option>Other</option>
      </select>
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="close_('mAsset')">Cancel</button>
      <button class="btn" onclick="saveAsset()">Save</button>
    </div>
    <button class="del" id="aDel" onclick="deleteAsset()">Delete this asset</button>
  </div>
</div>

<!-- Transaction modal -->
<div class="modal" id="mTx" onclick="if(event.target===this)close_('mTx')">
  <div class="sheet">
    <h3 id="tTitle">New Transaction</h3>
    <div class="field"><label>Asset</label><select id="tAsset"></select></div>
    <div class="field">
      <label>Action</label>
      <div class="seg" id="seg">
        <button data-k="add" class="on">+ Add</button>
        <button data-k="remove">− Remove</button>
        <button data-k="value">⟳ Update value</button>
      </div>
      <div class="hint" id="segHint">Money you put in.</div>
    </div>
    <div class="field"><label>Amount (₱)</label><input id="tAmt" type="number" step="0.01" placeholder="0.00"></div>
    <div class="field"><label>Date</label><input id="tDate" type="date"></div>
    <div class="actions">
      <button class="btn ghost" onclick="close_('mTx')">Cancel</button>
      <button class="btn" onclick="saveTx()">Save</button>
    </div>
  </div>
</div>

<script>
const KEY='portfolio-tracker-v1';
const COLORS=['#7c5cff','#22d3ee','#34d399','#fbbf24','#f472b6','#60a5fa','#fb923c','#a3e635','#e879f9'];
let db=JSON.parse(localStorage.getItem(KEY)||'{"assets":[],"tx":[]}');
let editAsset=null, editTx=null, kind='add';

const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const uid=()=>Math.random().toString(36).slice(2,10);
const peso=n=>'₱'+n.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const color=a=>COLORS[db.assets.indexOf(a)%COLORS.length];
const sortedTx=()=>[...db.tx].sort((a,b)=>a.date.localeCompare(b.date)||a.t-b.t);

// value + invested of an asset up to a date
function calc(assetId,upTo='9999-12-31'){
  let value=0,inv=0;
  for(const t of sortedTx()){
    if(t.assetId!==assetId||t.date>upTo)continue;
    if(t.kind==='add'){value+=t.amount;inv+=t.amount}
    else if(t.kind==='remove'){value-=t.amount;inv-=t.amount}
    else value=t.amount;
  }
  return {value,inv};
}

function render(){
  const h=new Date().getHours();
  document.getElementById('greet').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+' 👋';

  let total=0,inv=0;
  const per=db.assets.map(a=>{const c=calc(a.id);total+=c.value;inv+=c.inv;return {a,...c}});
  document.getElementById('total').textContent=peso(total);
  document.getElementById('sInv').textContent=peso(inv);
  document.getElementById('sCount').textContent=db.assets.length;
  document.getElementById('sTx').textContent=db.tx.length;

  // asset cards
  const el=document.getElementById('assets');
  el.innerHTML=per.length?per.map(({a,value})=>{
    return `<div class="card asset" style="--c:${color(a)}" onclick="openAsset('${a.id}')">
      <span class="type">${a.type}</span>
      <div class="name">${esc(a.name)}</div>
      <div class="val">${peso(value)}</div>
    </div>`}).join('')
    :`<div class="card empty" style="grid-column:1/-1">No assets yet — tap <b>+ Asset</b> to start 🌱</div>`;

  // transactions
  const tl=document.getElementById('txList');
  const list=sortedTx().reverse().slice(0,30);
  tl.innerHTML=list.length?list.map(t=>{
    const a=db.assets.find(x=>x.id===t.assetId);if(!a)return'';
    const m={add:['+','rgba(52,211,153,.15)','var(--green)','Added'],remove:['−','rgba(248,113,113,.15)','var(--red)','Removed'],value:['⟳','rgba(124,92,255,.18)','var(--accent)','Value update']}[t.kind];
    return `<div class="tx">
      <div class="ic" style="background:${m[1]};color:${m[2]}">${m[0]}</div>
      <div class="meta">${esc(a.name)}<small>${m[3]} · ${new Date(t.date+'T00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})}</small></div>
      <div class="amt" style="color:${m[2]}">${peso(t.amount)}</div>
      <button class="x" title="Edit" onclick="openTx('${t.id}')">✎</button>
      <button class="x" title="Delete" onclick="delTx('${t.id}')">✕</button>
    </div>`}).join(''):`<div class="empty">No transactions yet.</div>`;

  drawLine(); drawDonut(per,total);
}

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// ---- charts ----
function setup(c){
  if(!c.dataset.h)c.dataset.h=c.getAttribute('height'); // remember original height once
  const r=devicePixelRatio||1,w=c.clientWidth,h=+c.dataset.h;
  c.width=w*r;c.height=h*r;c.style.height=h+'px';
  const x=c.getContext('2d');x.scale(r,r);return [x,w,h];
}
function drawLine(){
  const c=document.getElementById('line'),[x,w,h]=setup(c);
  const dates=[...new Set(sortedTx().map(t=>t.date))];
  if(dates[dates.length-1]!==today()&&dates.length)dates.push(today());
  if(dates.length<2){x.fillStyle='#8a90a6';x.font='13px sans-serif';x.textAlign='center';x.fillText('Your growth chart appears after 2+ dates',w/2,h/2);return}
  const pts=dates.map(d=>db.assets.reduce((s,a)=>s+calc(a.id,d).value,0));
  const max=Math.max(...pts),min=Math.min(...pts,0),pad=24,range=max-min||1;
  const X=i=>i/(pts.length-1)*w, Y=v=>pad+(1-(v-min)/range)*(h-pad*2);
  const grad=x.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(124,92,255,.4)');grad.addColorStop(1,'rgba(124,92,255,0)');
  x.beginPath();pts.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));
  x.lineTo(w,h);x.lineTo(0,h);x.fillStyle=grad;x.fill();
  const lg=x.createLinearGradient(0,0,w,0);lg.addColorStop(0,'#7c5cff');lg.addColorStop(1,'#22d3ee');
  x.beginPath();pts.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));
  x.strokeStyle=lg;x.lineWidth=2.5;x.lineJoin='round';x.stroke();
  const li=pts.length-1;x.beginPath();x.arc(X(li)-3,Y(pts[li]),5,0,7);x.fillStyle='#22d3ee';x.fill();
  x.fillStyle='#8a90a6';x.font='11px sans-serif';
  x.textAlign='left';x.fillText(dates[0],0,h-4);x.textAlign='right';x.fillText(dates[li],w,h-4);
}
function drawDonut(per,total){
  const c=document.getElementById('donut'),[x,w,h]=setup(c);
  const cx=w/2,cy=h/2,r=Math.min(w,h)/2-6;
  // group by type
  const byType={};per.forEach(p=>{if(p.value>0)byType[p.a.type]=(byType[p.a.type]||0)+p.value});
  const items=Object.entries(byType).sort((a,b)=>b[1]-a[1]);
  let ang=-Math.PI/2;
  if(!items.length){x.beginPath();x.arc(cx,cy,r,0,7);x.arc(cx,cy,r*.68,7,0,true);x.fillStyle='rgba(255,255,255,.06)';x.fill()}
  items.forEach(([t,v],i)=>{
    const a=v/total*Math.PI*2;
    x.beginPath();x.arc(cx,cy,r,ang,ang+a-.02);x.arc(cx,cy,r*.68,ang+a-.02,ang,true);
    x.fillStyle=COLORS[i%COLORS.length];x.fill();ang+=a;
  });
  x.fillStyle='#eef0f6';x.font='600 15px sans-serif';x.textAlign='center';
  x.fillText(items.length+' type'+(items.length===1?'':'s'),cx,cy+5);
  document.getElementById('legend').innerHTML=items.map(([t,v],i)=>
    `<div><span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>${t}<span class="pct">${(v/total*100).toFixed(1)}%</span></div>`).join('');
}

// ---- modals ----
const open_=id=>document.getElementById(id).classList.add('show');
const close_=id=>document.getElementById(id).classList.remove('show');

function openAsset(id){
  editAsset=id?db.assets.find(a=>a.id===id):null;
  aTitle.textContent=editAsset?'Edit Asset':'New Asset';
  aName.value=editAsset?editAsset.name:'';
  aType.value=editAsset?editAsset.type:'HYSA';
  aDel.style.display=editAsset?'block':'none';
  open_('mAsset');setTimeout(()=>aName.focus(),50);
}
function saveAsset(){
  const name=aName.value.trim();if(!name)return aName.focus();
  if(editAsset){editAsset.name=name;editAsset.type=aType.value}
  else db.assets.push({id:uid(),name,type:aType.value});
  save();close_('mAsset');render();
}
function deleteAsset(){
  if(!confirm(`Delete "${editAsset.name}" and all its transactions?`))return;
  db.tx=db.tx.filter(t=>t.assetId!==editAsset.id);
  db.assets=db.assets.filter(a=>a!==editAsset);
  save();close_('mAsset');render();
}

const hints={add:'Money you put in.',remove:'Money you took out.',value:'Set the current market value (e.g. stocks went up). Doesn\'t count as money added.'};
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setKind(b.dataset.k));
function setKind(k){kind=k;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));segHint.textContent=hints[k]}

function openTx(id){
  if(!db.assets.length){openAsset();return}
  editTx=id?db.tx.find(t=>t.id===id):null;
  tTitle.textContent=editTx?'Edit Transaction':'New Transaction';
  tAsset.innerHTML=db.assets.map(a=>`<option value="${a.id}">${esc(a.name)} — ${a.type}</option>`).join('');
  tAsset.value=editTx?editTx.assetId:db.assets[0].id;
  tAmt.value=editTx?editTx.amount:'';
  tDate.value=editTx?editTx.date:today();
  setKind(editTx?editTx.kind:'add');
  open_('mTx');setTimeout(()=>tAmt.focus(),50);
}
function saveTx(){
  const amount=parseFloat(tAmt.value);if(!(amount>=0)||!tDate.value)return tAmt.focus();
  const data={assetId:tAsset.value,kind,amount,date:tDate.value};
  if(editTx)Object.assign(editTx,data);else db.tx.push({id:uid(),t:Date.now(),...data});
  save();close_('mTx');render();
}
function delTx(id){if(confirm('Delete this transaction?')){db.tx=db.tx.filter(t=>t.id!==id);save();render()}}

// ---- backup ----
function exportData(){
  const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='portfolio-backup-'+today()+'.json';a.click();
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  f.text().then(s=>{try{const d=JSON.parse(s);if(d.assets&&d.tx){db=d;save();render()}}catch{alert('Invalid file')}});
}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){close_('mAsset');close_('mTx')}});
addEventListener('resize',render);
render();
</script>
</body>
</html>
